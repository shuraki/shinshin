<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Rubik,sans-serif;background:#fbfaff;position:relative;color:#1e1b3a}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:520px;height:520px;background:#9175ff;opacity:.55;top:-180px;right:-120px}
.b2{width:460px;height:460px;background:#ff8a65;opacity:.45;bottom:-200px;left:-100px}
.b3{width:380px;height:380px;background:#ffd54f;opacity:.5;bottom:-160px;right:300px}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(116,68,251,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(116,68,251,.07) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:relative;padding:70px 80px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#7444fb,#d946ef,#ff6b4a);color:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 10px 30px rgba(116,68,251,.35)}
h1{margin-top:56px;font-size:96px;font-weight:800;line-height:1.05;letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,#6527f0,#e0429a 55%,#ff6b4a);-webkit-background-clip:text;color:transparent}
p{margin-top:24px;font-size:36px;font-weight:500;color:#4b4870}
.chips{margin-top:auto;display:flex;gap:14px}
.chip{background:#fff;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:700;box-shadow:0 6px 20px rgba(30,27,58,.08)}
</style></head><body>
<div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
<div class="brand"><div class="logo">✦</div>שנה הבאה</div>
<h1>מה עושים <span>בשנה הבאה?</span></h1>
<p>כל שנות השירות במקום אחד: חיפוש, השוואה ומקורות רשמיים</p>
<div class="chips"><div class="chip">📚 חינוך</div><div class="chip">🌿 טבע</div><div class="chip">💛 שילוב</div><div class="chip">🏘️ קהילה</div><div class="chip">🌾 חקלאות</div></div>
</div></body></html>
